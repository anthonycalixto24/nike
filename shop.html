<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shop all — NIKE</title>
    <meta name="description" content="Browse every silhouette in the collection." />
    <link rel="stylesheet" href="assets/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main>
      <section class="page-head">
        <div class="container">
          <p class="eyebrow mb-2">The collection</p>
          <h1 class="h-display h2 mb-2">All products</h1>
          <p class="lead-sm mb-0">
            Eight silhouettes across running, basketball, training and lifestyle.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="toolbar d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div class="d-flex flex-wrap gap-2" id="chips"></div>
            <div class="d-flex flex-wrap gap-2 align-items-center">
              <input
                class="form-control form-control-sm"
                type="search"
                id="search-input"
                placeholder="Search styles"
                aria-label="Search styles"
                style="min-width: 11rem"
              />
              <select class="form-select form-select-sm" id="sort-select" aria-label="Sort products">
                <option value="featured">Featured</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="rating">Top rated</option>
              </select>
            </div>
          </div>

          <p class="small text-muted" id="results-count"></p>

          <div class="row g-3 g-lg-4" id="shop-grid"></div>

          <div class="text-center py-5 d-none" id="empty-state">
            <p class="h5 fw-bold text-uppercase mb-1">Nothing matches</p>
            <p class="text-muted small mb-3">No styles found for “<span id="empty-query"></span>”.</p>
            <button class="btn btn-outline-ink btn-sm" id="reset-filters" type="button">Reset filters</button>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script src="assets/vendor/bootstrap.bundle.min.js"></script>
    <script src="assets/js/art.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/cards.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/shop.js"></script>
  </body>
</html>
